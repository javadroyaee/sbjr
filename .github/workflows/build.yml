name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/jrweb_release.jks -alias jrweb_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "JRweb@2026" -keypass "JRweb@2026" -dname "CN=JRweb, OU=Development, O=JRweb, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trakonesh-JRweb-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
